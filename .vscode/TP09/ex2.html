<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="w-[300px] h-[500px] bg-gray-200 border-2 border-black flex justify-center items-center m-auto mt-10 shadow-lg"
    >
      <div id="background" class="w-[280px] h-[480px] bg-white">
        <div
          class="w-full h-[30px] bg-white flex justify-start items-center pl-2"
        >
          <h1 class="text-blue-500 text-[14px] font-semibold">
            Random Color Generator
          </h1>
        </div>
        <div
          class="w-[272px] h-[120px] bg-black ml-1 p-2 flex flex-col justify-around items-center"
        >
          <div>
            <h1 class="text-white text-[25px] font-bold">Background Color :</h1>
          </div>
          <div>
            <h1 id="color-code" class="text-white text-[25px] font-bold">
              #FFFFFF
            </h1>
          </div>
        </div>
        <div class="flex justify-center items-center w-full h-[50px]">
          <button
            onclick="colorGenerator.generate()"
            class="bg-black border-2 border-black rounded-sm text-white font-semibold p-1 mr-1"
          >
            GENERATE
          </button>
          <button
            onclick="colorGenerator.reset()"
            class="border-2 border-black rounded-sm font-semibold p-1 ml-1"
          >
            RESET
          </button>
        </div>
        <div class="w-full h-[170px] bg-white">
          <div
            id="record"
            class="text-left space-y-2 pl-2 text-[13px] pt-1"
          ></div>
        </div>
      </div>
    </div>
    <script>
      class Color {
        constructor() {
          this.records = [];
        }

        generate() {
          let newColor = `#${this.getRandomNumber()}`;
          document.getElementById("background").style.backgroundColor =
            newColor;
          document.getElementById("color-code").innerText = newColor;
          this.records.push(newColor);
          this.updateHistory();
        }

        getRandomNumber() {
          return Math.floor(Math.random() * 16777215)
            .toString(16)
            .padStart(6, "0")
            .toUpperCase();
        }

        updateHistory() {
          let historyDiv = document.getElementById("record");
          historyDiv.innerHTML = "";
          this.records
            .slice(-6)
            .reverse()
            .forEach((color) => {
              let div = document.createElement("div");
              div.className = "flex items-center space-x-2";
              div.innerHTML = `<span>${color}</span> <div class="w-4 h-4 rounded" style="background: ${color};"></div>`;
              historyDiv.appendChild(div);
            });
        }

        reset() {
          this.records = [];
          document.getElementById("record").innerHTML = "";
          document.getElementById("background").style.backgroundColor =
            "#FFFFFF";
          document.getElementById("color-code").innerText = "#FFFFFF";
        }
      }

      let colorGenerator = new Color();
    </script>
  </body>
</html>
