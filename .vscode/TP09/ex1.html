<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="border-2 border-black shadow-lg flex flex-col justify-center items-center w-[300px] h-[500px] bg-gray-200 m-auto mt-10"
    >
      <div
        class="flex justify-center items-center w-full h-[100px] font-bold text-2xl color-red-500 text-blue-500"
      >
        <h1>COUNTER</h1>
      </div>
      <div
        class="flex justify-center items-center font-semibold text-7xl w-full h-[50px] text-blue-500"
      >
        <h1 id="value">0</h1>
      </div>
      <div class="flex justify-around items-center w-full h-[100px]">
        <div
          class="border-2 border-blue-500 rounded-md p-0.5 text-[13px] font-semibold text-blue-500 ml-5"
        >
          <button onclick="decrease()">DECREASE</button>
        </div>
        <div
          id="reset"
          class="border-2 border-blue-500 rounded-md p-0.5 text-[13px] font-semibold text-blue-500"
        >
          <button onclick="reset()">RESET</button>
        </div>
        <div
          id="increase"
          class="border-2 border-blue-500 rounded-md p-0.5 text-[13px] font-semibold text-white bg-blue-500 mr-5"
        >
          <button onclick="increase()">INCREASE</button>
        </div>
      </div>
    </div>

    <script>
      function decrease() {
        var value = document.getElementById("value");
        var currentValue = parseInt(value.innerText);
        value.innerText = currentValue - 1;
      }
      function reset() {
        var value = document.getElementById("value");
        value.innerText = 0;
      }
      function increase() {
        var value = document.getElementById("value");
        var currentValue = parseInt(value.innerText);
        value.innerText = currentValue + 1;
      }
    </script>
  </body>
</html>
